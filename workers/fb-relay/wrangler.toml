name = "fb-relay"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# KV namespace holding the relayed reports (each entry expires after 7 days).
# Create it once and paste the generated id below:
#   npx wrangler kv namespace create REPORTS
[[kv_namespaces]]
binding = "REPORTS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secrets (never in this file):
#   wrangler secret put REPORT_TOKEN       — shared secret required to POST
# Vars (set for production; unset = localhost dev origins only):
#   [vars]
#   ALLOWED_ORIGINS = "https://your-board.example"
